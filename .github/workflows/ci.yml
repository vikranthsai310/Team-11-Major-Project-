name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      # --cov-fail-under enforces X-5: without it the coverage target is a
      # suggestion, and the modules that carry the results are exactly the ones
      # that drift first.
      - name: Commit-gate test suite
        run: >
          pytest tests/ -m "not slow"
          --cov=src/batcher --cov-report=term-missing --cov-fail-under=90
