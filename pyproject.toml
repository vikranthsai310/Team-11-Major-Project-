[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batcher"
version = "0.1.0"
description = "AI-driven adaptive transaction batching for Cardano decentralized exchanges"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<21",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "lightgbm>=4.3,<5",
    # Required by lightgbm.sklearn (LGBMRegressor, early stopping callbacks).
    "scikit-learn>=1.4,<2",
    "torch>=2.3,<3",
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.4,<3",
    "sb3-contrib>=2.4,<3",
    "matplotlib>=3.8,<4",
    "pycardano>=0.12,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<0.15",
    "pre-commit>=3.7,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: system, ML and full-episode tests; excluded from the commit gate",
]

[tool.coverage.run]
source = ["src/batcher"]
omit = ["*/eval/plots.py", "*/__init__.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Stated explicitly rather than left to ruff's first-party heuristic. That
# heuristic reads the environment — with `batcher` pip-installed, CI classified
# it as third-party while a local checkout classified it first-party, so the same
# ruff version on the same files passed locally and failed in CI.
known-first-party = ["batcher", "conftest"]
